
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Gestão 93 - Controle de Vendas</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f8fafc;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior-y: contain;
        user-select: none;
      }
      * {
        scrollbar-width: thin;
        scrollbar-color: #4f46e5 #f1f5f9;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      #root {
        min-height: 100vh;
        min-height: -webkit-fill-available;
      }
    </style>
</head>
  <body>
    <div id="root">
      <div style="height: 100vh; display: flex; align-items: center; justify-content: center; background: #312e81; color: white; font-family: sans-serif;">
        <div style="text-align: center; padding: 20px;">
          <h2 style="margin-bottom: 10px;">Carregando Gestão 93...</h2>
          <div style="width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.3); border-top: 4px solid white; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto;"></div>
          <p id="status-msg" style="margin-top: 20px; font-size: 14px; opacity: 0.9;">Iniciando sistema...</p>
          <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
        </div>
      </div>
    </div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
