    <div id="root">
      <div style="height: 100vh; display: flex; align-items: center; justify-content: center; background: #312e81; color: white; font-family: sans-serif;">
        <div style="text-align: center; padding: 20px;">
          <h2 style="margin-bottom: 10px;">Carregando Gestão 93...</h2>
          <div style="width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.3); border-top: 4px solid white; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto;"></div>
          <p id="status-msg" style="margin-top: 20px; font-size: 14px; opacity: 0.9;">Iniciando sistema...</p>
          <div style="margin-top: 20px;">
            <button onclick="clearCacheAndReload()" style="padding: 10px 20px; background: rgba(255,255,255,0.2); border: 1px solid white; color: white; border-radius: 8px; font-size: 14px; cursor: pointer;">Limpar Cache e Recarregar</button>
          </div>
          <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
        </div>
      </div>
    </div>
    <script type="module" src="/index.tsx"></script>
    <script>
      const statusMsg = document.getElementById('status-msg');
      
      function clearCacheAndReload() {
        statusMsg.innerText = "Limpando cache...";
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(registrations => {
            for(let registration of registrations) { registration.unregister(); }
            caches.keys().then(names => {
              for (let name of names) caches.delete(name);
              window.location.href = window.location.origin + '?reload=' + Date.now();
            });
          });
        } else {
          window.location.href = window.location.origin + '?reload=' + Date.now();
        }
      }

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js', { scope: './' })
            .then(reg => {
              console.log('Gestão 93: PWA Pronto.');
              statusMsg.innerText = "Sistema pronto para uso offline.";
            })
            .catch(err => {
              console.warn('Gestão 93: PWA em modo online.', err);
              statusMsg.innerText = "Sistema em modo online.";
            });
        });
      }

      // Handle PWA install prompt
      window.addEventListener('beforeinstallprompt', (e) => {
        console.log('PWA: Pronto para instalar');
        // Optionally show a button here
      });
    </script>
